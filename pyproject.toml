[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portscope"
version = "0.1.0"
description = "A Python TCP port scanner for authorized security testing, supporting configurable targets and port ranges, open/closed/filtered status detection, timestamped JSON/CSV reports, validation, testing, and responsible-use safeguards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AVIP CyberSecurity Intern" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Operating System :: OS Independent",
]

[project.scripts]
portscope = "portscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
